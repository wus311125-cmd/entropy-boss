<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>熵 · ENTROPY</title>
<style>
  :root{
    --paper:#f2efe8;      /* 冷白宣紙 */
    --paper-deep:#ebe7dd; /* 更深留白 */
    --ink:#1a1a1c;        /* 墨 */
    --ink-soft:#55534d;   /* 灰墨 */
    --silver:#c7ccd2;     /* 銀 */
    --silver-hi:#f4f6f8;  /* 銀芯 */
    --red:#b23a2e;        /* 唯一紅 —— 眾生之信念 */
    --line:rgba(26,26,28,.14);
    --sans:"Hiragino Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --serif:"Noto Serif TC","Songti SC","STSong","SimSun",Georgia,serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:radial-gradient(130% 90% at 50% 8%, var(--paper) 0%, var(--paper-deep) 100%);
    color:var(--ink); font-family:var(--serif); overflow:hidden;
    -webkit-font-smoothing:antialiased; user-select:none;
  }
  #wrap{ position:relative; width:100vw; height:100vh; }

  /* 紙紋 —— 極淡 grain，Nier 嗰種紙質 */
  #grain{
    position:absolute; inset:0; z-index:1; pointer-events:none; opacity:.5;
    background-image:radial-gradient(rgba(0,0,0,.025) 1px, transparent 1px);
    background-size:22px 22px; mix-blend-mode:multiply;
  }
  #stage{ position:absolute; inset:0; z-index:2; }
  #stage canvas{ width:100%; height:100%; display:block; }

  /* ============ 頂部標題 ============ */
  #title{
    position:absolute; top:7vh; left:0; width:100%; text-align:center; z-index:5;
    pointer-events:none;
  }
  #title .en{
    font-size:clamp(11px,1.7vw,16px); letter-spacing:.68em; color:var(--ink-soft);
    text-transform:uppercase; font-family:var(--sans); font-weight:400;
  }
  #title .cn{
    margin-top:14px; font-size:clamp(34px,8vw,72px); letter-spacing:.42em; color:var(--ink);
    font-weight:400; text-indent:.42em; /* 補回 letter-spacing 尾端 */
  }
  #eraTag{
    margin-top:16px; font-size:clamp(12px,2vw,16px); color:var(--ink-soft);
    letter-spacing:.26em; font-style:italic;
  }

  /* ============ HP ============ */
  #hpBar{
    position:absolute; left:50%; bottom:15vh; transform:translateX(-50%);
    width:min(56vw,52vh); height:1px; background:var(--line); z-index:5;
  }
  #hpFill{
    position:absolute; left:0; top:-0.5px; height:2px; width:100%;
    background:var(--ink); transform-origin:left; transition:transform .5s cubic-bezier(.3,.7,.3,1);
  }
  #hpNums{
    position:absolute; left:50%; bottom:calc(15vh + 14px); transform:translateX(-50%);
    font-size:11px; letter-spacing:.2em; color:var(--ink-soft); z-index:5; font-family:var(--sans);
  }

  /* ============ 留言輸入（幾近透明，聚焦浮現） ============ */
  #dock{
    position:absolute; left:50%; bottom:8vh; transform:translateX(-50%);
    width:min(60vw,560px); z-index:6; text-align:center;
  }
  #promptLine{
    font-size:clamp(12px,1.8vw,15px); color:var(--ink-soft); letter-spacing:.14em;
    margin-bottom:16px; font-style:italic;
  }
  #port{
    position:relative; width:100%;
  }
  #port::before{
    content:"✻"; position:absolute; left:-4px; top:50%; transform:translateY(-50%);
    color:var(--ink-soft); font-size:11px; opacity:.5; font-family:var(--sans);
  }
  #commentBox{
    width:100%; background:transparent; border:none; border-bottom:1px solid var(--line);
    outline:none; color:var(--ink); font-family:var(--serif);
    font-size:clamp(16px,3.2vw,22px); letter-spacing:.06em; padding:8px 18px 10px; text-align:center;
    caret-color:var(--red); transition:border-color .3s;
  }
  #commentBox::placeholder{ color:rgba(26,26,28,.28); font-style:italic; }
  #commentBox:focus{ border-bottom-color:rgba(178,58,46,.5); }
  .hint{ margin-top:14px; font-size:11px; color:rgba(26,26,28,.4); letter-spacing:.2em; font-family:var(--sans); }
  #enterKey{
    display:inline-block; border:1px solid var(--line); border-radius:3px;
    padding:1px 7px; margin:0 2px; font-size:10px;
  }

  /* ============ 留言牆（極淡，可隱藏） ============ */
  #wall{
    position:absolute; right:3vw; top:50%; transform:translateY(-50%); z-index:6;
    width:min(220px,24vw); max-height:70vh; overflow-y:auto;
    opacity:.55; transition:opacity .4s; text-align:right;
  }
  #wall:hover{ opacity:1; }
  #wall::-webkit-scrollbar{ width:0; }
  .w-msg{ margin:14px 0; }
  .w-msg .t{ display:block; font-size:clamp(12px,1.6vw,15px); color:var(--ink); line-height:1.5; }
  .w-msg .meta{ font-size:10.5px; color:rgba(26,26,28,.45); margin-top:5px; font-family:var(--sans); letter-spacing:.08em; }
  .like-btn{
    background:none; border:1px solid rgba(178,58,46,.4); color:var(--red); border-radius:999px;
    padding:2px 9px; font-size:11px; cursor:pointer; margin-left:6px; font-family:var(--sans);
    transition:all .2s;
  }
  .like-btn:hover{ background:rgba(178,58,46,.08); border-color:var(--red); }

  /* ============ 中央寫字 / 冷言 / 結局 ============ */
  #verse, #ending{
    position:absolute; inset:0; z-index:8; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(242,239,232,.6); backdrop-filter:none;
    pointer-events:none; opacity:0; transition:opacity .9s;
  }
  #verse.show{ opacity:1; }
  #verse p{
    font-size:clamp(18px,3.4vw,30px); letter-spacing:.1em; color:var(--ink);
    font-style:italic; line-height:1.7; padding:0 8vw;
  }
  #verse small{
    margin-top:18px; font-size:clamp(11px,1.6vw,14px); color:var(--ink-soft);
    letter-spacing:.22em; font-family:var(--sans);
  }

  #ending{ pointer-events:auto; background:rgba(242,239,232,.94); }
  #ending.show{ opacity:1; }
  #ending h2{ font-size:clamp(20px,3.6vw,34px); letter-spacing:.3em; font-weight:400; color:var(--ink); }
  #ending .line{ margin-top:24px; font-size:clamp(14px,2.4vw,20px); line-height:2; color:var(--ink-soft); letter-spacing:.08em; padding:0 10vw; }
  #ending .sig{ margin-top:34px; font-size:12px; color:rgba(26,26,28,.4); letter-spacing:.3em; font-family:var(--sans); }
  #ending .btn{
    margin-top:40px; padding:14px 46px; border:1px solid var(--ink); border-radius:2px;
    background:transparent; color:var(--ink); font-family:var(--serif); font-size:15px; letter-spacing:.3em;
    cursor:pointer; transition:all .3s;
  }
  #ending .btn:hover{ background:var(--ink); color:var(--paper); }

  /* ============ 微紅 —— 全場唯一 red ============ */
  #redPulse{
    position:absolute; z-index:9; left:50%; top:50%; pointer-events:none;
    width:0; height:0; border-radius:50%; opacity:0;
    box-shadow:0 0 60px 30px rgba(178,58,46,.35);
  }
  .red-shot{ animation:redpulse .8s ease-out forwards; }
  @keyframes redpulse{ 0%{opacity:0; transform:scale(.2)} 30%{opacity:1} 100%{opacity:0; transform:scale(1)} }

  /* 冷言小字 —— 魔王說話 */
  #bossLine{
    position:absolute; left:50%; top:22vh; transform:translateX(-50%);
    width:80%; text-align:center; z-index:5; pointer-events:none;
    font-size:clamp(14px,2.2vw,20px); color:rgba(26,26,28,.66);
    letter-spacing:.1em; font-style:italic; opacity:0; transition:opacity 1s; line-height:1.8;
  }
  #bossLine.show{ opacity:1; }

  @media (max-width:760px){
    #wall{ right:auto; left:6vw; top:auto; bottom:6vh; transform:none; text-align:left; width:40vw; max-height:32vh; opacity:.5; }
    #title{ top:4vh; }
    #hpBar{ bottom:6vh; width:70vw; }
    #hpNums{ bottom:calc(6vh + 16px); }
    #dock{ bottom:auto; top:1vh; width:88vw; }
    #commentBox{ font-size:17px; }
    #port::before{ display:none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="grain"></div>

  <div id="title">
    <div class="en">E N T R O P Y</div>
    <div class="cn">熵</div>
    <div id="eraTag">第一章 · 初臨</div>
  </div>

  <div id="bossLine"></div>

  <div id="hpNums"><span id="hpN">1000</span> / <span id="hpM">1000</span></div>
  <div id="hpBar"><div id="hpFill"></div></div>

  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="redPulse"></div>

  <div id="wall"></div>

  <div id="dock">
    <div id="promptLine">將你嘅話，化作一羽光</div>
    <div id="port">
      <input id="commentBox" maxlength="80" placeholder="留一句嘢……" autocomplete="off">
    </div>
    <div class="hint">按 <span id="enterKey">↵ 送出</span></div>
  </div>

  <div id="verse"></div>
  <div id="ending" style="display:none"></div>
</div>

<script>
/* =====================================================================
   熵 · ENTROPY  v2 (Nier 風格)
   一隻永存嘅黑日。佢唔係敵人 —— 佢係萬物之必然（熵）。
   眾生一句話 = 一羽銀光。愈多 ♥，光羽愈亮、愈痛。
   佢會復活。每一次，紋路更深（熵增）。你明知徒勞，仍然出手。
   —— 呢個就係「生而為人」。
===================================================================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap');
let W,H,dpr=Math.min(devicePixelRatio||1,2);
function fit(){ W=cv.width=Math.floor(wrap.clientWidth*dpr); H=cv.height=Math.floor(wrap.clientHeight*dpr); }
fit(); addEventListener('resize',fit);

/* ---------- 黑日 (Sun) 參數 ---------- */
let sun={ x:.5, y:.46, r:0, rings:[], era:1 };
const RING_BASE=1.55, RING_GROW=1.28, DMG_COLOR='#b23a2e';

function setEra(n, reset){
  if(reset){ sun.era=1; sun.rings=buildRings(1); }
  else { sun.era=n; sun.rings=buildRings(n); }
  document.getElementById('hpN').textContent = fmt(sunHp());
  document.getElementById('hpM').textContent = fmt(sunMax());
  eraText();
  if(!reset) coldSpeak();
}
function buildRings(n){
  // 熵增：每世 +1 環、每環更歪、碎片更多
  const arr=[];
  for(let i=0;i<n;i++){
    arr.push({
      speed:(0.6+i*0.11)*(Math.random()<.5?1:-1),
      tilt:Math.PI*(0.25+0.09*(n-i)),   // 越新環越傾斜
      radius:RING_BASE*(1+i*0.12),
      broken:0.6+i*0.05,   // 斷開比例
      dots: 3+i*2,          // 碎片星點
      phase:Math.random()*6.28,
    });
  }
  return arr;
}

/* ---------- 粒子庫 ---------- */
const meteors=[]; // 灰塵
for(let i=0;i<70;i++) meteors.push({x:Math.random(),y:Math.random(),r:.4+Math.random()*1.2,sp:.0003+Math.random()*.0008,ph:Math.random()*6.28,a:.2+Math.random()*.3});
const bullets=[]; // 光羽（銀）
const sparks=[];  // 命中火花
let t=0;

/* ---------- 生命值 ---------- */
const BASE_HP=1000, MULT=1.7;
function sunMax(){ return Math.round(BASE_HP*Math.pow(MULT,sun.era-1)); }
function sunHp(){ return hp; }
let hp=sunMax();
function fmt(n){ if(n>=1e6)return (n/1e6).toFixed(1)+'M'; if(n>=1e4)return (n/1e3).toFixed(1)+'k'; return Math.round(n).toLocaleString(); }

function damage(n){
  if(hp<=0) return;
  hp-=n; if(hp<0)hp=0;
  document.getElementById('hpN').textContent=fmt(hp);
  const fill=document.getElementById('hpFill');
  fill.style.transform=`scaleX(${Math.max(0,hp/sunMax())})`;
  if(hp<=0) die();
}
function die(){
  // 潰散 → 復活（更強）
  for(let i=0;i<150;i++) sparks.push({x:W*.5+(-60+Math.random()*120)*dpr,y:H*.46+(-60+Math.random()*120)*dpr,vx:(-3+Math.random()*6)*dpr,vy:(-5+Math.random()*8)*dpr,life:60,color:'#fff'});
  setTimeout(()=>setEra(sun.era+1,false), 1400);
}

/* ---------- 冷言（魔王喺復活嗰刻說話） ---------- */
const COLDS=[
  '你殺唔死我。正如你殺唔死日昇月落。',
  '我即萬物之必然。',
  '你嘅字，我都收下喇。',
  '我唔憎你。我甚至謝你出手。',
  '你越用力，我嘅紋路越深。',
];
let ci=0;
function coldSpeak(){
  const b=document.getElementById('bossLine');
  b.textContent='「'+COLDS[ci++%COLDS.length]+'」';
  b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'), 3400);
}

/* ---------- 提示韻文（旁白） ---------- */
const VERSES=[
  '萬物有序，唯熵不減。',
  '你射出去嘅，終會散落。',
  '眾生之語，即眾生之矛。',
  '光嚟自黑暗。希望嚟自徒勞。',
  '佢唔係要殺你。佢只係存在。',
  '熵流不息，如落日復明。',
];
let vi=0;
setInterval(()=>{
  const v=document.getElementById('verse');
  v.innerHTML=`<p>${VERSES[vi++%VERSES.length]}</p><small>·</small>`;
  v.classList.add('show');
  setTimeout(()=>v.classList.remove('show'), 3000);
},6500);

/* ---------- 留言 = 光羽 ---------- */
const NPC=[
  '我都係得一把口。','唔好放棄。','我喺度。',
  '將我呀啲，一併送你。','我哋一齊。','之後交俾你喇。'
];
function launchBullet(text,dmg,mine){
  bullets.push({text, dmg, x:-20, y:(0.55+Math.random()*0.3)*H, ty:(0.46)*H+((-10+Math.random()*20))*dpr, life:110, mine});
  addWall(text,dmg,mine);
}
function addWall(text,dmg,mine){
  const wall=document.getElementById('wall');
  const m=document.createElement('div'); m.className='w-msg';
  const id=Math.random().toString(36).slice(2);
  m.innerHTML=`<span class="t">${esc(text)}</span>
    <span class="meta">${mine?'我':'路人'} · ${dmg}<button class="like-btn" data-id="${id}" data-dmg="${dmg}">♥ 0</button></span>`;
  wall.prepend(m);
  if(wall.children.length>40) wall.lastChild.remove();
}
const likes={};
document.addEventListener('click',e=>{
  const b=e.target.closest('.like-btn'); if(!b)return;
  const id=b.dataset.id, d=+b.dataset.dmg;
  likes[id]=(likes[id]||0)+1;
  b.querySelector('button').innerHTML=`♥ ${likes[id]}`;
  // 紅色信念之光
  const rp=document.getElementById('redPulse');
  rp.style.left=(W/2/dpr)+'px'; rp.style.top=(H/2/dpr)+'px';
  rp.classList.remove('red-shot'); void rp.offsetWidth; rp.classList.add('red-shot');
  launchBullet('♥', Math.round(d+likes[id]), false);
});

/* ---------- 輸入 ---------- */
const box=document.getElementById('commentBox');
const BASE_ATK=8, LEN_W=0.8;
function fire(){
  const text=box.value.trim(); if(!text)return;
  launchBullet(text, Math.round(BASE_ATK+text.length*LEN_W), true);
  box.value='';
}
box.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); fire(); } });

/* NPC 不定時出羽 */
let npcT;
function schedNPC(){ npcT=setTimeout(()=>{
  const dmg=BASE_ATK+Math.floor(Math.random()*10);
  const txt=NPC[Math.floor(Math.random()*NPC.length)];
  addWall(txt,dmg,false);
  if(Math.random()<.7) launchBullet('「'+txt+'」',dmg,false);
  schedNPC();
},4000+Math.random()*4500); }
schedNPC();

/* ---------- 主渲染 ---------- */
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function draw(){
  t+=.004;
  ctx.clearRect(0,0,W,H);

  const cx=W*sun.x, cy=H*sun.y, R=Math.min(W,H)*.16;

  /* 灰塵 */
  for(const m of meteors){
    m.x+=m.sp; if(m.x>1.02)m.x=-.02;
    const a=m.a*(0.6+0.4*Math.sin(t*2+m.ph));
    ctx.fillStyle=`rgba(26,26,28,${a})`;
    ctx.beginPath(); ctx.arc(m.x*W,m.y*H,m.r*dpr,0,6.28); ctx.fill();
  }

  /* ---- 黑日光環（最外層先） ---- */
  for(const ring of sun.rings){
    const rr=R*ring.radius;
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(ring.tilt);
    // 橢圓化 —— 從觀察者角度睇係斜環
    ctx.scale(1,0.42);
    ctx.strokeStyle='rgba(26,26,28,'+(0.22+0.02*ring.broken)+')';
    ctx.lineWidth=1*dpr;
    ctx.setLineDash([1,que(ring.broken)]);
    ctx.lineDashOffset=t*20*ring.speed;
    ctx.beginPath(); ctx.arc(0,0,rr,0,6.28); ctx.stroke();
    ctx.setLineDash([]);
    // 環上星點
    for(let k=0;k<ring.dots;k++){
      const a=ring.phase+t*ring.speed+ k*(6.28/ring.dots);
      const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
      ctx.fillStyle='rgba(26,26,28,.5)';
      ctx.beginPath(); ctx.arc(px,py, (1.1+0.4*Math.sin(t*3+k))*dpr,0,6.28); ctx.fill();
    }
    ctx.restore();
  }

  /* ---- 黑日本體 ---- */
  const pulse=1+0.006*Math.sin(t*6);
  const Rr=R*pulse;
  // 暈
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,Rr*2.4);
  grad.addColorStop(0,'rgba(20,20,22,.55)');
  grad.addColorStop(.45,'rgba(20,20,22,.18)');
  grad.addColorStop(1,'rgba(20,20,22,0)');
  ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(cx,cy,Rr*2.4,0,6.28); ctx.fill();
  // 本體
  ctx.fillStyle='#0c0c0e';
  ctx.beginPath(); ctx.arc(cx,cy,Rr,0,6.28); ctx.fill();
  // 表面紋路（熵之裂痕）
  for(const ring of sun.rings){
    ctx.strokeStyle='rgba(255,255,255,'+(0.05+0.01*ring.era??0.05)+')';
    ctx.lineWidth=.6*dpr;
    ctx.beginPath();
    for(let a=0;a<=6.28;a+=.3){
      const rr=Rr*(0.5+0.1*Math.sin(ring.phase+a*3));
      const px=cx+Math.cos(a)*rr*(1+ (sun.era-1)*0.01);
      const py=cy+Math.sin(a)*rr*0.6;
      a===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.stroke();
  }

  /* ---- 光羽（子彈） —— 銀，射向黑日 ---- */
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i], tx=cx+(-8+Math.random()*16), ty=cy;
    const dx=tx-b.x, dy=ty-b.y;
    const dist=Math.hypot(dx,dy);
    if(dist<8){
      // 命中 —— 白漣漪 + 火花
      for(let k=0;k<26;k++) sparks.push({x:tx,y:ty,vx:(-4+Math.random()*8)*dpr,vy:(-4+Math.random()*8)*dpr,life:34,color:Math.random()<.15?'#b23a2e':'#fff'});
      damage(b.dmg);
      bullets.splice(i,1); continue;
    }
    const sp=Math.max(2.5, dist*0.06)* (b.dmg/6);
    b.x+=dx/dist*sp; b.y+=dy/dist*sp; b.life-=1;
    // 一道銀曳光
    ctx.strokeStyle=`rgba(199,204,210,${0.4+0.3*Math.min(b.dmg/30,1)})`;
    ctx.lineWidth=(1+Math.min(b.dmg/40,2))*dpr*1.4;
    ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-dx/dist*16*dpr, b.y-dy/dist*16*dpr); ctx.stroke();
    ctx.fillStyle=Math.random()<.04?'#b23a2e':'#f4f6f8';
    ctx.beginPath(); ctx.arc(b.x,b.y,(1.3+0.6*Math.min(b.dmg/30,1.5))*dpr,0,6.28); ctx.fill();
  }

  /* ---- 火花 ---- */
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i]; s.x+=s.vx; s.y+=s.vy; s.vy+=.12*dpr; s.life--;
    if(s.life<=0){sparks.splice(i,1);continue;}
    ctx.fillStyle=s.color; ctx.globalAlpha=Math.min(1,s.life/20);
    ctx.beginPath(); ctx.arc(s.x,s.y,1.2*dpr,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;

  requestAnimationFrame(draw);
}
function que(x){ // 斷開環 —— dash pattern
  return Math.max(2, 1.6*(1-x)+6);
}
draw();

/* ---------- 結局（幾代之後嘅溫柔） ---------- */
let eraCount=0;
const origSetEra=setEra;
setEra=function(n,reset){
  origSetEra(n,reset);
  eraCount = reset?0:eraCount;
  if(!reset) eraCount++;
  if(eraCount>=8){
    ending();
  }
};
function ending(){
  const e=document.getElementById('ending');
  e.style.display='flex';
  e.innerHTML=`
    <h2>致 每一個曾出手嘅人</h2>
    <div class="line">
      黑日唔曾被殺死。佢只係暫時被<em>記住</em>。<br>
      你嘅一句話，喺呢個熵流不息嘅世界度，<br>
      眾生之間，曾經亮過一瞬。<br><br>
      <span style="color:var(--red)">♥</span> 多謝你出手。
    </div>
    <div class="sig">—— 佢最終都唔係你敵人，係你一直喺度對抗緊嘅，自身嘅重力</div>
    <button class="btn" onclick="location.reload()">重新出發</button>
  `;
  setTimeout(()=>e.classList.add('show'), 200);
}

/* 起動 */
setEra(1,true);
</script>
</body>
</html>
